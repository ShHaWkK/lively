name: Validate mouse wheel forwarding

on:
  push:
    branches: [fix/web-wallpaper-mouse-wheel]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore src/Lively/Lively/Lively.csproj
      - name: Build
        run: dotnet build src/Lively/Lively/Lively.csproj -c Release --no-restore
